/* ====== 進行 ====== */
const S = { shift: null, day: DAYS[0], dayIdx: 0, i: 0, score: 0, log: [], claims: [], claimCount: 0, lvl: 1, streak: 0, combo: 0, maxCombo: 0,
  t0: 0, raf: 0, locked: true, timer: 0, next: null, halted: false, audit: null, auditFailed: false, after: null };
const limit = () => LIMITS[S.lvl - 1];

function start(dayIdx) {
  SND.unlock();
  clearTimeout(S.timer); cancelAnimationFrame(S.raf);
  const day = DAYS[dayIdx];
  S.shift = makeShift(day);
  Object.assign(S, { day, dayIdx, i: 0, score: 0, log: [], claims: [], claimCount: 0, lvl: day.startLvl, streak: 0, combo: 0, maxCombo: 0,
    next: null, halted: false, audit: null, auditFailed: false, after: null, paused: false });
  $toasts.innerHTML = "";
  // 3D の塗装テクスチャを先に作っておく（箱の切替で待たないように）
  if (View === View3D) {
    // 品物の形を先に作っておく（最初の箱で待たないように）
    PARTS.forEach((t, i) => setTimeout(() => { try { View3D.buildModel({ type: t, side: t.sided ? "R" : null, color: COLORS[0] }); } catch (e) {} }, 200 + i * 80));
  }
  enterBox();
}

async function enterBox() {
  const due = S.claims.filter(c => c.at <= S.i);
  S.claims = S.claims.filter(c => c.at > S.i);
  for (const c of due) arriveClaim(c);
  if (S.claimCount >= S.day.claimMax) { S.halted = true; finish(); return; }
  // 監査の始まり
  if (S.day.boss && S.i === BOSS_FROM && !S.audit) {
    const most = S.shift.boxes.slice(BOSS_FROM).reduce((t, b) => t + (b.defect ? DMG_CATCH : DMG_SHIP), 0);
    const hp = Math.round(most * (S.day.bossK || 0.8));
    S.audit = { hp, max: hp, strikes: 0, active: true, passed: false };
  }
  S.locked = true;
  await renderBox();
  if (S.i === 0) {
    SND.notice();
    bigText(`第${S.dayIdx + 1}日`, S.day.sub, "intro", 1500, S.day.name).then(run);
  } else if (S.audit && S.audit.active && S.i === BOSS_FROM) {
    SND.boss(); buzz([300, 100, 300]);
    bigText("客先監査", "監査員　重箱 隅子 が現れた", "boss", 1600).then(run);
  }
  else run();
}

function arriveClaim(c) {
  S.score += CLAIM;
  S.claimCount++;
  c.log.claimed = true;
  S.lvl = 1; S.streak = 0; S.combo = 0;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="m">${CLAIM} 点</span><b>市場クレーム発生（${S.claimCount} / ${S.day.claimMax}）</b>箱 ${c.log.box.n}・${esc(c.log.box.truth.type.name)}：${esc(describe(c.log.box))}`;
  $toasts.appendChild(el);
  setTimeout(() => el.remove(), 5600);
  $app.classList.remove("shake"); void $app.offsetWidth; $app.classList.add("shake");
  SND.claim(); buzz([120, 80, 120, 80, 220]);
  View.flash();
}

function run() {
  S.next = null;
  S.elapsed = 0;
  resumeLoop();
}
/* コンベアを（再び）動かす。S.t0 はそのまま */
function resumeLoop() {
  S.locked = false;
  S.lastT = performance.now();
  View.setRunning(true, S.lvl);
  SND.ambient(true, S.lvl);
  cancelAnimationFrame(S.raf);
  const step = () => {
    if (S.locked) return;
    const now = performance.now();
    S.elapsed += Math.min(100, now - S.lastT); S.lastT = now;
    const k = Math.min(1, S.elapsed / (limit() * 1000));
    View.setProgress(k);
    if (k >= 1) { fallOff(); return; }
    S.raf = requestAnimationFrame(step);
  };
  S.raf = requestAnimationFrame(step);
  if (document.hidden) pauseGame();
}
function pauseGame() {
  if (S.paused || S.locked || $bins.hidden) return;
  S.paused = true; S.pauseAt = performance.now();
  S.locked = true; cancelAnimationFrame(S.raf);
  View.setRunning(false); SND.ambient(false);
  const m = document.createElement("div");
  m.className = "pausemenu"; m.id = "pausemenu";
  m.innerHTML = `<div class="pm-in" role="dialog" aria-label="一時停止">
      <div class="pm-title">一時停止</div>
      <div class="pm-sub">第${S.dayIdx + 1}日　${esc(S.day.name)}　箱 ${S.i + 1} / ${BOXES}</div>
      <button class="big-btn" id="pmResume" type="button">再開する</button>
      <button class="sub-btn" id="pmRetry" type="button">この日をやり直す</button>
      <button class="sub-btn" id="pmTitle" type="button">日を選ぶ</button></div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); S.paused = false; S.next = null; };
  document.getElementById("pmResume").addEventListener("click", () => { close(); resumeLoop(); });
  document.getElementById("pmRetry").addEventListener("click", () => { close(); start(S.dayIdx); });
  document.getElementById("pmTitle").addEventListener("click", () => { close(); title(); });
  S.next = () => document.getElementById("pmResume").click();
  document.getElementById("pmResume").focus();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseGame(); });

function stopBelt() {
  S.locked = true; cancelAnimationFrame(S.raf);
  SND.ambient(false);
  View.setRunning(false);
  $bins.classList.add("off");
}
function fallOff() {
  stopBelt();
  View.flash();
  View.fall().then(() => judge("timeout"));
}

/* ====== 箱へ入れる ====== */
function drop(choice) {
  if (S.locked) return;
  SND.unlock();
  stopBelt();
  const bin = choice === "ok" ? $binOK : $binNG;
  if (choice === "ok") SND.ship(); else SND.thunk();
  View.fly(choice).then(() => {
    bin.classList.remove("gulp"); void bin.offsetWidth; bin.classList.add("gulp");
    judge(choice);
  });
}

/* 判定。通常は出荷（OK）の正誤を見せず、異常品なら数箱後にクレームが届く。
   監査中は監査員がその場で確かめるので、出荷の正誤もすぐ出る */
function judge(choice) {
  stopBelt();
  const box = S.shift.boxes[S.i];
  const sec = Math.min(limit(), (S.elapsed || 0) / 1000);
  const isNG = !!box.defect;
  const fast = Math.round((limit() - sec) / limit() * 50);
  const mult = MULT[S.lvl - 1];
  const a = S.audit && S.audit.active ? S.audit : null;
  const entry = { box, choice, sec, lvl: S.lvl, audit: !!a };
  let pts, kind, title, reveal = true, dmg = 0, strike = false;
  const before = S.lvl;

  if (choice === "ok") {
    pts = Math.round((SHIP + fast) * mult); kind = isNG ? "escape" : "hit";
    if (a) {
      if (isNG) { pts = -300; strike = true; title = "監査員の指摘：異常品を出荷"; }
      else { dmg = DMG_SHIP; title = "出荷　監査員が確認しました"; }
    } else {
      reveal = false;
      if (isNG) S.claims.push({ at: S.i + 2 + rnd(3), log: entry });
    }
  } else if (choice === "ng") {
    if (isNG) { pts = Math.round((CATCH + fast) * mult); kind = "hit"; dmg = DMG_CATCH; title = S.combo >= 4 ? `ナイスストップ　連続 ${S.combo + 1}` : "ナイスストップ"; }
    else {
      pts = OVER; kind = "over"; title = "過検出（良品を止めた）";
      // 監査中の過検出は「判定基準が分かっていない」として指摘され、疑いも少し戻る
      if (a) { strike = true; dmg = -DMG_CATCH; title = "監査員の指摘：良品を止めた"; }
    }
  } else {
    pts = STOP; kind = "timeout"; title = a ? "監査員の指摘：ライン停止" : "時間切れ（ライン停止）"; strike = !!a;
  }
  Object.assign(entry, { kind, pts });
  S.log.push(entry);
  S.score += pts;

  if (kind === "over" || (kind === "escape" && a)) { S.lvl = Math.max(1, S.lvl - 1); S.streak = 0; S.combo = 0; }
  else if (kind === "timeout") { S.lvl = 1; S.streak = 0; S.combo = 0; }
  else {
    S.streak++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
    if (S.streak % 3 === 0) S.lvl = Math.min(5, S.lvl + 1);
  }
  const up = S.lvl > before;

  // 監査の決着
  if (a) {
    a.hp = Math.max(0, Math.min(a.max, a.hp - dmg));
    if (strike) a.strikes++;
    const bar = document.querySelector(".boss .hp i");
    if (bar) bar.style.width = (a.hp / a.max * 100).toFixed(1) + "%";
    if (a.hp === 0) { View.setAudit(false); a.active = false; a.passed = true; S.score += BOSS_BONUS; S.after = "pass"; }
    else if (a.strikes >= AUDIT_MAX) { View.setAudit(false); a.active = false; S.auditFailed = true; S.after = "fail"; }
  }

  if (!reveal) {
    floatPts($binOK, `+${pts}`, up ? `ライン速度 ${S.lvl}` : (S.combo >= 3 ? `連続 ${S.combo}` : ""));
    S.next = null;
    S.timer = setTimeout(next, up ? 380 : 220);
    if (up) SND.levelup();
    return;
  }
  const good = kind === "hit";
  // 監査員の疑いの増減は、監査中だけ表示する
  const hit = !a ? "" : dmg > 0 ? `<div class="dmg">監査員の疑い −${dmg}</div>` : dmg < 0 ? `<div class="dmg">監査員の疑い ＋${-dmg}</div>` : "";
  if (good) {
    // 正解は止めずに次の箱へ。得点と理由は上に一瞬出す
    SND.catch(S.combo); buzz(40); if (up) setTimeout(() => SND.levelup(), 250);
    floatPts(choice === "ok" ? $binOK : $binNG, `+${pts}`, up ? `ライン速度 ${S.lvl}` : (S.combo >= 3 ? `連続 ${S.combo}` : ""));
    if (box.defect) flashToast("ok", title, describe(box) + (a && dmg > 0 ? `　監査員の疑い −${dmg}` : ""), 2000);
    else if (a) flashToast("ok", "監査員が確認しました", `監査員の疑い −${dmg}`, 1200);
    S.next = null;
    S.timer = setTimeout(next, 420);
    return;
  }
  if (box.defect) markDefect(box);
  if (kind === "timeout") { SND.stopLine(); buzz([200, 100, 200]); }
  else { SND.bad(); buzz([80, 60, 80]); }
  bubble(good ? "good" : "bad", `
      <div class="mark">${good ? "○" : "✕"}</div>
      <div class="what">${title}</div>
      <div class="why">${esc(describe(box))}</div>
      ${hit}
      <div class="pts">${pts >= 0 ? "+" : ""}${pts} 点${up ? `　<span class="lvup">ライン速度 ${S.lvl}</span>` : ""}</div>
      <div class="next">タップで次へ</div>`, 2000);
}

/* 画面上部の短い知らせ（操作は止めない）。kind：ok（正解）・info（班長の連絡） */
function flashToast(kind, head, body, ms = 1700) {
  for (const t of $toasts.querySelectorAll(".toast." + kind)) t.remove();
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `<b>${esc(head)}</b>${body ? esc(body) : ""}`;
  $toasts.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* 得点が箱から跳ね上がる表示（操作は止めない） */
function floatPts(bin, main, sub) {
  const r = bin.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "floatpts";
  el.style.left = (r.left + r.width / 2) + "px";
  el.style.top = (r.top - 4) + "px";
  el.innerHTML = `<b>${esc(main)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
  const sc = document.querySelector(".hud .score");
  if (sc) { sc.lastChild.textContent = S.score.toLocaleString("ja-JP"); sc.classList.remove("bump"); void sc.offsetWidth; sc.classList.add("bump"); }
}

function markDefect(box) {
  const d = box.defect;
  const mark = (card, f) => { const r = document.querySelector(`[data-card="${card}"] [data-f="${f}"]`); if (r) r.classList.add("hit"); };
  if (d.where === "label") mark("label", d.field === "blur" ? "pn" : d.field);
  if (d.where === "sheet") mark("sheet", "color");
  if (d.where === "part" || d.where === "both") {
    document.getElementById("stage").classList.add("hit");
    View.reveal();
  }
}

function bubble(cls, html, ms) {
  const v = document.createElement("div");
  v.className = "verdict " + cls;
  v.innerHTML = `<div class="bubble" role="status">${html}</div>`;
  document.getElementById("desk").appendChild(v);
  const go = () => { clearTimeout(S.timer); S.next = null; next(); };
  S.next = go;
  v.querySelector(".bubble").addEventListener("click", go);
  S.timer = setTimeout(go, ms);
}

function next() {
  const after = S.after; S.after = null;
  if (after === "fail") { finish(); return; }
  const go = () => { S.i++; if (S.i >= BOXES) finish(); else enterBox(); };
  if (after === "pass") {
    $bins.classList.add("off");
    SND.win(); buzz([60, 40, 60, 40, 200]);
    bigText("監査　合格", `指摘 ${S.audit.strikes} 件　＋${BOSS_BONUS.toLocaleString("ja-JP")} 点`, "gold", 1600).then(go);
  } else go();
}

/* ====== 結果 ====== */
async function finish() {
  $bins.hidden = true;
  SND.ambient(false);
  View.unmount();
  clearTimeout(S.timer); cancelAnimationFrame(S.raf);
  const late = S.claims.map(c => c.log);
  for (const c of S.claims) { S.score += CLAIM; S.claimCount++; c.log.claimed = true; c.log.late = true; }
  S.claims = [];
  if (S.day.boss && !S.halted && !(S.audit && S.audit.passed)) S.auditFailed = true;
  const cleared = !S.halted && !S.auditFailed && S.claimCount < S.day.claimMax;
  const last = S.dayIdx === DAYS.length - 1;

  // 決着の大きな文字
  if (S.halted || S.claimCount >= S.day.claimMax) { SND.lose(); await bigText("出荷停止", `市場クレーム ${S.claimCount} 件`, "red", 1700); }
  else if (S.auditFailed) { SND.lose(); await bigText("監査　不合格", S.audit && S.audit.strikes >= AUDIT_MAX ? `指摘 ${S.audit.strikes} 件` : "監査員の疑いを晴らせなかった", "red", 1700); }
  else { SND.end(); await bigText(last ? "全工程　完了" : `第${S.dayIdx + 1}日　完了`, last ? "七日間、流出を食い止めた" : "", "gold", 1700); }

  // 進行と自己ベストの保存
  let best = null, unlocked = 0;
  const bk = BEST_KEY + "-" + S.dayIdx;
  try {
    unlocked = +(localStorage.getItem(DAY_KEY) || 0);
    if (cleared && S.dayIdx + 1 > unlocked) { unlocked = Math.min(DAYS.length - 1, S.dayIdx + 1); localStorage.setItem(DAY_KEY, unlocked); }
    const v = localStorage.getItem(bk); best = v === null ? null : +v;
    if (cleared && (best === null || S.score > best)) localStorage.setItem(bk, S.score);
  } catch (e) {}
  const isBest = cleared && (best === null || S.score > best);

  const L = S.log;
  const ngBoxes = L.filter(x => x.box.defect).length;
  const okBoxes = L.length - ngBoxes;
  const escape = L.filter(x => x.kind === "escape").length;
  const over = L.filter(x => x.kind === "over").length;
  const hits = L.filter(x => x.kind === "hit").length;
  const avg = L.length ? L.reduce((s, x) => s + x.sec, 0) / L.length : 0;
  const pct = (a, b) => b ? (a / b * 100).toFixed(0) : "–";
  const rank = S.halted || S.claimCount >= S.day.claimMax ? ["出荷停止", `市場クレームが ${S.claimCount} 件に達し、ラインが止められました。`]
    : S.auditFailed ? ["監査不合格", "監査員の疑いを晴らせませんでした。監査区間は異常が多めです。"]
    : escape === 0 && over === 0 ? ["流出ゼロの守護神", "異常も過検出もありません。"]
    : escape === 0 ? ["流出ゼロ", "止めすぎはありましたが、異常品は一件も出荷していません。"]
    : ["合格（要再教育）", "クリアしましたが流出があります。下の一覧で見逃した箇所を確認してください。"];
  const cats = {};
  for (const x of L.filter(x => x.box.defect)) {
    const c = category(x.box); cats[c] = cats[c] || [0, 0]; cats[c][1]++;
    if (x.kind !== "hit") cats[c][0]++;
  }
  const weak = Object.entries(cats).filter(([, v]) => v[0] > 0).map(([k, v]) => `${k} ${v[0]}/${v[1]}`).join("、");
  const misses = L.filter(x => x.kind !== "hit");
  const kindName = { escape: "流出", over: "過検出", timeout: "時間切れ" };
  const canNext = cleared && !last;
  const rate = L.length ? hits / L.length : 0;
  let run = 0; S.maxCombo = 0;
  for (const x of L) { run = x.kind === "hit" ? run + 1 : 0; S.maxCombo = Math.max(S.maxCombo, run); }
  const grade = !cleared ? "—" : escape === 0 && over === 0 && rate >= 0.95 ? "S" : escape === 0 && rate >= 0.85 ? "A" : escape <= 1 ? "B" : "C";
  const strip = L.map(x => x.kind === "hit" ? (x.choice === "ng" ? "●" : "■") : x.kind === "escape" ? "✕" : x.kind === "over" ? "△" : "・").join("");
  const shareText = `三点照合ゲーム　第${S.dayIdx + 1}日「${S.day.name}」${rank[0]}（ランク ${grade}）\n得点 ${S.score.toLocaleString("ja-JP")}　流出 ${escape}　過検出 ${over}　最大連続 ${S.maxCombo}\n${strip}`;

  $app.className = "wrap plain";
  $app.innerHTML = `
    <div class="screen">
      <div class="resulthead">
        <div class="grade g-${grade === "—" ? "x" : grade}" aria-label="ランク ${grade}">${grade}</div>
        <div><h1>第${S.dayIdx + 1}日　${esc(S.day.name)}<small>${L.length} 箱のうち異常は ${ngBoxes} 箱でした</small></h1>
        <div class="rank ${cleared ? "" : "halt"}">${rank[0]}<span>${rank[1]}</span></div></div>
      </div>
      <div class="actions">
        ${canNext ? `<button class="big-btn" id="nextDay" type="button">第${S.dayIdx + 2}日へ進む</button>` : ""}
        <button class="${canNext ? "sub-btn" : "big-btn"}" id="again" type="button">${cleared ? "もう一度" : "やり直す"}</button>
        <button class="sub-btn" id="toTitle" type="button">日を選ぶ</button>
      </div>
      <dl class="stats">
        <div class="stat"><dt>得点</dt><dd>${S.score.toLocaleString("ja-JP")}${isBest ? `<small class="pb">自己ベスト更新</small>` : ""}</dd></div>
        <div class="stat"><dt>正答</dt><dd>${hits}<small>/ ${L.length}</small></dd></div>
        <div class="stat ${escape ? "warn" : ""}"><dt>見逃し率（流出）</dt><dd>${pct(escape, ngBoxes)}<small>% ・ ${escape} 件</small></dd></div>
        <div class="stat"><dt>過検出率</dt><dd>${pct(over, okBoxes)}<small>% ・ ${over} 件</small></dd></div>
        <div class="stat"><dt>平均判定時間</dt><dd>${avg.toFixed(1)}<small>秒</small></dd></div>
        <div class="stat"><dt>最大連続</dt><dd>${S.maxCombo}</dd></div>
      </dl>
      <div class="share">
        <pre id="shareText">${esc(shareText)}</pre>
        <button class="sub-btn" id="copy" type="button">結果をコピー</button>
        <div class="legend">■ 出荷　● 止めた　✕ 流出　△ 過検出　・ ライン停止</div>
      </div>
      ${weak ? `<div class="best">見逃した異常：${esc(weak)}</div>` : ""}
      ${late.length ? `<div class="best">シフト後に届いたクレーム ${late.length} 件（${CLAIM * late.length} 点）を得点に含めています。</div>` : ""}
      ${misses.length ? `<details class="missbox" ${misses.length <= 4 ? "open" : ""}><summary>まちがえた箱　${misses.length} 件</summary><ul class="misses">${misses.map(x =>
        `<li class="${x.late ? "late" : ""}"><span class="k">${kindName[x.kind]}${x.late ? "（シフト後）" : x.audit && x.kind !== "over" ? "（監査で指摘）" : ""}</span>箱 ${x.box.n}・${esc(x.box.truth.type.name)}　${esc(describe(x.box))}</li>`).join("")}</ul></details>` : ""}
    </div>`;
  if (canNext) document.getElementById("nextDay").addEventListener("click", () => start(S.dayIdx + 1));
  document.getElementById("again").addEventListener("click", () => start(S.dayIdx));
  document.getElementById("toTitle").addEventListener("click", title);
  document.getElementById("copy").addEventListener("click", e => {
    const btn = e.currentTarget;
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(document.getElementById("shareText"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent = "選択しました。コピーしてください";
    };
    try { navigator.clipboard.writeText(shareText).then(() => { btn.textContent = "コピーしました"; }, fallback); } catch (err) { fallback(); }
  });
}

/* ====== 表示の切替（自動・ライト・ダーク）。保存キーは QC Workbench 共通 ====== */
const THEME_KEY = "qc-workbench-theme";
function themeNow() { try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; } }
function themeSwitch() {
  const t = themeNow();
  return `<div class="themes" role="group" aria-label="表示">${[["auto", "自動"], ["light", "ライト"], ["dark", "ダーク"]].map(([k, n]) =>
    `<button type="button" data-theme-set="${k}" aria-pressed="${t === k}">${n}</button>`).join("")}</div>`;
}
function bindThemeSwitch() {
  document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.themeSet;
    try { if (k === "auto") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, k); } catch (e) {}
    if (k === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k;
    document.querySelectorAll("[data-theme-set]").forEach(x => x.setAttribute("aria-pressed", x.dataset.themeSet === k));
    if (View === View3D && View3D.ok) View3D.applyLighting();
  }));
}
/* いまの表示がダークか（3D の背景色を決めるのに使う） */
function isDark() {
  const t = document.documentElement.dataset.theme;
  if (t) return t === "dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (View === View3D && View3D.ok) View3D.applyLighting(); });

/* ====== 開始画面 ====== */
function title() {
  View.unmount();
  let unlocked = 0;
  try { unlocked = +(localStorage.getItem(DAY_KEY) || 0); } catch (e) {}
  const bestOf = i => { try { const v = localStorage.getItem(BEST_KEY + "-" + i); return v === null ? null : +v; } catch (e) { return null; } };
  $bins.hidden = true;
  $app.className = "wrap plain";
  $app.innerHTML = `
    <div class="screen">
      <div class="topbar">
        <div class="crumb"><a href="https://kotaooka.github.io/" target="_blank" rel="noopener">QC Workbench</a> › 三点照合ゲーム</div>
        ${themeSwitch()}
      </div>
      <h1 class="logo">三点照合ゲーム<small>作業指示書・現品票・現品を見比べて、合っていれば出荷、違っていれば止めます。</small></h1>
      ${View === View3D ? `<section class="stage showcase" id="show" aria-hidden="true"></section>` : ""}
      <ol class="steps">
        <li><span class="sn">1</span><b>見比べる</b><span class="sd">指示書が正。現品票と現品が同じか</span></li>
        <li><span class="sn">2</span><b class="k">右へ → 出荷</b><span class="sd">三つとも合っていれば段ボールへ</span></li>
        <li><span class="sn">3</span><b class="r">← 左へ 止める</b><span class="sd">不良も誤品も、一つでも違えば</span></li>
      </ol>
      <p class="fine">出荷した箱の正誤はその場では出ません。異常品を出すと数箱あとに<b class="r">市場クレーム</b>が届き、たまると出荷停止。2日目からは11箱目で<b>客先監査</b>が始まります。現品をタップすると識別ラベルを拡大できます。</p>
      <ol class="days">
        ${DAYS.map((d, i) => {
          if (i > unlocked + 1) return "";
          const open = i <= unlocked, b = bestOf(i);
          return `<li><button class="day ${open ? "" : "locked"}" type="button" data-day="${i}" ${open ? "" : "disabled"}>
            <span class="dn">第${i + 1}日</span><span class="dt">${open ? esc(d.name) : "未解放"}</span>
            <span class="ds">${open ? esc(d.sub) : `第${i}日をクリアすると開きます`}</span>
            ${open && b !== null ? `<span class="db mono">${b.toLocaleString("ja-JP")}</span>` : ""}
            ${open && d.boss ? `<span class="bossmark">監査あり</span>` : ""}
          </button></li>`;
        }).join("")}
      </ol>
      ${unlocked + 2 < DAYS.length ? `<p class="fine">この先 ${DAYS.length - unlocked - 2} 日。最後は第7日「客先監査週間」です。</p>` : ""}
      <footer class="foot">
        <a href="https://github.com/kotaooka/santen-check" target="_blank" rel="noopener">GitHub</a><span aria-hidden="true">・</span>
        <span>MIT License</span><span aria-hidden="true">・</span>
        <a class="bmc" href="https://buymeacoffee.com/kotaooka" target="_blank" rel="noopener"><span aria-hidden="true">☕</span> 開発を応援する（Buy Me a Coffee）</a>
      </footer>
    </div>`;
  bindThemeSwitch();
  $app.querySelectorAll(".day:not(.locked)").forEach(b => b.addEventListener("click", () => start(+b.dataset.day)));
  const show = document.getElementById("show");
  if (show) {
    const demo = makeShift(DAYS[1]).boxes.find((b, i) => i > 3 && !b.defect && b.part.count > 1) || makeShift(DAYS[1]).boxes[0];
    View3D.mount(show, demo, { demo: true }).catch(() => show.remove());
  }
}

/* ====== 操作 ====== */
$binOK.addEventListener("click", e => { e.currentTarget.blur(); drop("ok"); });
$binNG.addEventListener("click", e => { e.currentTarget.blur(); drop("ng"); });
document.addEventListener("keydown", e => {
  // ほかのボタンにフォーカスがあるときは、そのボタンの操作を優先する
  const onBtn = e.target.closest && e.target.closest("button");
  if (e.key === "Escape" && S.paused && S.next) { e.preventDefault(); S.next(); return; }
  if ((e.key === "Enter" || e.key === " ") && S.next && (!onBtn || onBtn.id === "pmResume" || onBtn.closest(".verdict"))) { e.preventDefault(); S.next(); return; }
  if ($bins.hidden) return;
  if (e.key === "Escape" || e.key === "p") { e.preventDefault(); pauseGame(); return; }
  if (S.paused) return;
  if (e.key === "ArrowRight") { e.preventDefault(); drop("ok"); }
  if (e.key === "ArrowLeft") { e.preventDefault(); drop("ng"); }
});

SND.init();
if (View3D.init()) View = View3D;
for (const v of [View3D, ViewSVG]) { v.canSwipe = () => !S.locked; v.onSwipe = drop; }
title();
</script>
<script>
// オフラインで遊べるように Service Worker を登録する（対応していないブラウザでは何もしない）
if ("serviceWorker" in navigator) {
  addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
